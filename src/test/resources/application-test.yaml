server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:hub_test_db;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}